name: nomad_min CI and release

on:
  pull_request:
    branches: [nomad-min]
  push:
    branches: [nomad-min]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify and package without publishing a release
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: nomad-min-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reserve build space on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h "${GITHUB_WORKSPACE}"
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Install package verification tools
        run: sudo apt-get update && sudo apt-get install -y zstd qemu-user
      - name: Verify candidate source
        run: scripts/nomad-min/verify.sh
      - name: Build and verify both architecture packages
        env:
          OUT_DIR: ${{ runner.temp }}/nomad-min-release
        run: |
          scripts/nomad-min/package.sh
          scripts/nomad-min/verify-packages.sh | tee "${OUT_DIR}/nomad-min-validation.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nomad-min-${{ github.sha }}
          path: ${{ runner.temp }}/nomad-min-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    if: github.ref == 'refs/heads/nomad-min' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.verify_only))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nomad-min-${{ github.sha }}
          path: ${{ runner.temp }}/nomad-min-release
      - name: Publish verified immutable release
        env:
          OUT_DIR: ${{ runner.temp }}/nomad-min-release
        run: |
          version="$(tr -d '[:space:]' < nomad-min/UPSTREAM_VERSION)"
          commit="$(git rev-parse --short=12 HEAD)"
          upstream="$(cut -c1-12 nomad-min/UPSTREAM_COMMIT)"
          tag="nomad-min-v${version//+/-}-r${commit}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; retaining its assets unchanged."
            exit 0
          fi
          cat >"${RUNNER_TEMP}/release-notes.md" <<EOF
          Minimal Nomad agent ${version} for Mimir, built from the reviewed fork.

          - Source commit: ${GITHUB_SHA}
          - Upstream base commit: ${upstream}
          - Profile: nomad_min; agent and version commands
          - Architectures: Linux amd64 and arm64, statically linked
          - Validation: source regressions, dependency exclusions, package SHA256, embedded metadata, and execution of both architecture binaries
          - Backports and compatibility fixes: [source notes](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/nomad-min/BACKPORTS.md)

          Verify nomad-min-manifest.tsv and the adjacent SHA256 files before consuming the packages. This release does not deploy any agents.
          EOF
          gh release create "${tag}" "${OUT_DIR}/"* \
            --target "${GITHUB_SHA}" --latest \
            --title "nomad_min ${version}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
